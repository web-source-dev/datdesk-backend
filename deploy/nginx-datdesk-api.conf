# Dat Desk API — nginx in front of Node (port 7020)
#
# The admin CORS error on /extension/upload is almost always this:
# nginx default client_max_body_size is 1m, so a ZIP just over 1MB
# is rejected with 413 BEFORE Express (and CORS headers) run.
#
# On the API host:
#   1. Put `client_max_body_size 50m;` in the server{} that serves
#      datdesk.apexskillzone.com
#   2. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name datdesk.apexskillzone.com;

    client_max_body_size 50m;
    client_body_timeout 120s;

    # JSON 413 so the admin SPA can read the error instead of a CORS block
    error_page 413 = @upload_too_large;
    location @upload_too_large {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials true always;
        add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin, X-Partner-Key" always;
        add_header Vary Origin always;
        add_header Content-Type "application/json" always;
        return 413 '{"message":"Upload too large. nginx client_max_body_size must be at least 50m."}';
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Accept, Origin, X-Partner-Key" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        proxy_pass http://127.0.0.1:7020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 120s;
    }
}
